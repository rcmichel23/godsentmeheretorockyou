---
layout: default
---
{% assign video_posts = site.posts | where_exp: "post", "post.tags contains 'vid'" %}
{% if video_posts.size == 0 %}
  <p class="empty">no videos yet.</p>
{% else %}
  {% for post in video_posts %}
    <div style="margin-bottom: 24px;">
      {{ post.content | split: '</iframe>' | first | append: '</iframe>' }}
    </div>
  {% endfor %}
{% endif %}
